{% extends "include/_base.html" %}

{% load static %}

{% block title %}
    Logout — Nivora
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/logout.css' %}">
{% endblock %}

{% block content %}

<main class="logout-page">

    <section class="logout-card">

        <div class="logout-brand">
            N
        </div>

        <h1>
            Leaving Nivora?
        </h1>

        <p>
            Are you sure you want to log out of your Nivora account?
        </p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}

            <div class="logout-actions">

                <a href="{% url 'dashboard' %}" class="stay-button">
                    Stay Logged In
                </a>

                <button type="submit" class="logout-button">
                    Log Out
                </button>

            </div>

        </form>

    </section>

</main>

{% endblock %}
