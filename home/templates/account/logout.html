{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Logout — Nivora
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/logout.css' %}"
    >

</head>


<body>

    <main class="logout-page">

        <section class="logout-card">

            <div class="logout-logo">
                N
            </div>


            <span class="logout-eyebrow">
                ACCOUNT
            </span>


            <h1>
                Leaving Nivora?
            </h1>


            <p>
                Are you sure you want to log out
                of your Nivora account?
            </p>


            <form
                method="post"
                action="{{ action_url }}"
                class="logout-form"
            >

                {% csrf_token %}


                <div class="logout-actions">

                    <a
                        href="{% url 'dashboard' %}"
                        class="stay-button"
                    >
                        Stay Logged In
                    </a>


                    <button
                        type="submit"
                        class="logout-button"
                    >
                        <span>
                            Log Out
                        </span>

                        <span class="logout-arrow">
                            →
                        </span>
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
